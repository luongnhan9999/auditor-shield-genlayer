<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Shield Outer Path -->
  <path d="M32 8L50 16V30C50 41.5 42.5 50.5 32 55C21.5 50.5 14 41.5 14 30V16L32 8Z" 
        fill="#07090e" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Shield Inner Core -->
  <path d="M32 14L44 20.5V30C44 38.5 38 45.5 32 49C26 45.5 20 38.5 20 30V20.5L32 14Z" 
        fill="#064e3b" 
        fill-opacity="0.3" 
        stroke="#10b981" 
        stroke-width="1.5" 
        stroke-dasharray="2 1" />

  <!-- Center Security Check & AI Keyhole -->
  <path d="M25 31L30 36L39 25" 
        stroke="#10b981" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Circuit AI Nodes -->
  <circle cx="32" cy="14" r="2" fill="#06b6d4" />
  <circle cx="20" cy="20.5" r="1.5" fill="#10b981" />
  <circle cx="44" cy="20.5" r="1.5" fill="#10b981" />
  <circle cx="32" cy="49" r="2" fill="#10b981" />
</svg>